{{ define "main" }}
  {{ partial "page-header" . }}

  <section class="section-sm">
    <div class="container" data-aos="fade-up" data-aos-easing="linear" data-aos-duration="500">
      <div class="row">
        {{/* Get all members from data/members/ directory - sorted alphabetically by lastname */}}
        {{ range $member := sort site.Data.members "lastname" "asc" }}
          <div class="md:col-3 lg:col-4 mb-14">
            {{ partial "components/author-card" $member }}
          </div>
        {{ end }}
      </div>
    </div>
  </section>
{{ end }}
