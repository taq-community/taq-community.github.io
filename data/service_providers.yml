      description: "Sulys is a Québec-based startup specialized in water monitoring through environmental DNA. We offer a turnkey service that includes strategic sampling, genomic analysis, and a digital platform for data visualization and decision support. Our integrated and proactive approach enables the rapid detection of threats to human, animal, and environmental health, in both surface waters and wastewater."
      description_fr: "Sulys est une jeune entreprise québécoise spécialisée dans la vigie des eaux par ADN environnemental. Nous offrons un service clé en main regroupant l'échantillonnage stratégique, l'analyse génomique et une plateforme numérique de visualisation et d'aide à la décision. Notre approche intégrée et proactive permet de détecter rapidement des menaces pour la santé humaine, animale et environnementale, tant dans les eaux de surface que dans les eaux usées."
