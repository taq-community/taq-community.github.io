summary_en: "Diana plays a key role in the strategic development and implementation of innovative genomics projects. With expertise in scientific program management and stakeholder engagement, she actively contributes to advancing research and knowledge translation in health, environment, and agri-food sectors. Her leadership fosters interdisciplinary collaboration and enhances the visibility of Quebec research at national and international levels."

