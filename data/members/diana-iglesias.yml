title_fr: "Directrice de l'innovation et des programmes"
summary_fr: "Diana joue un rôle clé dans le développement stratégique et la mise en oeuvre de projets innovants en génomique. Forte d'une expertise en gestion de programmes scientifiques, elle contribue activement à l'avancement de la recherche et à la valorisation des découvertes scientifiques en santé, en environnement et en agroalimentaire. Son leadership favorise la collaboration interdisciplinaire et le rayonnement de la recherche québécoise à l'échelle nationale et internationale."

