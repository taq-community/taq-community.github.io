summary_en: "A biologist and ecologist by training, Aurore Lucas holds two master's degrees in functional ecology and biology from Montpellier (France) and UQAT. Her professional career has led her to design and carry out various projects related to major environmental and territorial issues, such as climate change, biodiversity, and sustainable resource management."

