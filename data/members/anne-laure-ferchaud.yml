# English content
title_en: "Ph.D., Scientific Advisor"
affiliation_en: "Parks Canada"
summary_en: "I provide scientific expertise, manage applied science projects, and offer expert advice on ecological integrity, species at risk, and climate change issues within national parks and national marine conservation areas. A key focus is on evaluating and advancing innovative methodologies—including artificial intelligence, genomics, and environmental DNA (eDNA)—to support evidence-based decision-making. I also coordinate a national community of practice in conservation genetics and contribute to international conservation efforts."

# French content
title_fr: "Ph.D., Conseillère scientifique"
affiliation_fr: "Parcs Canada"
summary_fr: "Je fournis une expertise scientifique, je gère des projets de science appliquée et j'offre des conseils spécialisés sur l'intégrité écologique, les espèces en péril et les enjeux liés aux changements climatiques dans les parcs nationaux et les aires marines nationales de conservation. Une priorité est accordée à l'évaluation et au développement de méthodologies innovantes — notamment l'intelligence artificielle, la génomique et l'ADN environnemental (ADNe) — afin de soutenir la prise de décision fondée sur des données probantes."

