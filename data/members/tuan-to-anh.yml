summary_en: "Tuan Anh To is currently working at the Ecotoxicogenomics and eDNA Laboratory at INRS-ETE in Québec. His research focuses on developing and optimizing analytical techniques to assess the effects of various contaminants on the detoxification systems of aquatic species."

