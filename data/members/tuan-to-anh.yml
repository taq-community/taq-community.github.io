summary_fr: "Tuan Anh To travaille actuellement au Laboratoire d'écotoxicogénomique et d'ADNe à l'INRS-ETE au Québec. Ses recherches se concentrent sur le développement et l'optimisation de techniques analytiques pour évaluer les effets de divers contaminants sur les systèmes de détoxification des espèces aquatiques."

