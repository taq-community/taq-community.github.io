# English content
title_taq_en: "Director of the TAQ"
affiliation_en: "Ph.D., Professor, INRS, Quebec"
summary_en: "Valérie Langlois holds the Canada Research Chair in Ecotoxicogenomics at INRS. Her research focuses on advancing standardized eDNA protocols, developing molecular tools to monitor biodiversity and assess contaminant impacts on ecosystems."

# French content
title_taq_fr: "Directrice de la TAQ"
affiliation_fr: "Ph.D., Professeure, INRS, Québec"
summary_fr: "Valérie Langlois détient la Chaire de recherche du Canada en Écotoxicogénomique à l'INRS. Ses recherches se concentrent sur l'avancement des protocoles d'ADNe standardisés, le développement d'outils moléculaires pour surveiller la biodiversité et évaluer les impacts des contaminants sur les écosystèmes."

