# English content
title_en: "Ph.D., Tenure-track professor"
affiliation_en: "Institut de recherche sur les forêts, UQAT, Quebec"
summary_en: "Limoilou is a Tenure-track professor at the Institute for Forest Research  of the Université du Québec en Abitibi-Témiscamingue. Her research interests focus on wildlife-habitat relationships, biodiversity conservation, and the use of both quantitative and qualitative approaches to answer various ecological questions."

# French content
title_fr: "Ph.D., Professeure sous octroi"
affiliation_fr: "Institut de recherche sur les forêts, UQAT, Quebec"
summary_fr: "Limoilou est professeure sous octroi à l'institut de recherche sur les forêts de l'Université du Québec en Abitibi-Témiscamingue. Ses intérêts de recherche se concentrent sur les relations faune-habitat, la conservation de la biodiversité et l'utilisation d'approches quantitatives et qualitatives pour répondre à diverses questions écologiques."

