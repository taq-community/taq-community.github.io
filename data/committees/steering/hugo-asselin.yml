# English content
title_taq_en: "Co-Director of the TAQ"
affiliation_en: "Professor, Université du Québec en Abitibi Temiscamingue, Quebec"
#summary_en: "Hugo Asselin is professor at UQAT's School of Indigenous Studies and he holds the Desjardins Chair in Small Community Development at UQAT. He conducts collaborative research with Indigenous and other local communities on various topics, including land and natural resources governance."

# French content
title_taq_fr: "Codirecteur de la TAQ"
affiliation_fr: "Professeur, Université du Québec en Abitibi Témiscamingue, Québec"
#summary_fr: "Hugo Asselin est professeur à l'École d'études autochtones de l'UQAT et il détient la Chaire Desjardins en développement des petites collectivités à l'UQAT. Il mène des recherches collaboratives avec les communautés autochtones et autres communautés locales sur divers sujets, incluant la gouvernance des terres et des ressources naturelles."

