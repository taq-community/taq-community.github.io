#summary_en: "Yann Surget-Groba is a professor in ecological and environmental genomics at the Université du Québec en Outaouais. His research focuses on conservation genetics and adaptation to climate change, as well as the development of tools for monitoring biodiversity and threatened and vulnerable species."

