#summary_fr: "Yann Surget-Groba est professeur en génomique écologique et environnementale à l'Université du Québec en Outaouais. Ses recherches se concentrent sur la génétique de la conservation et l'adaptation aux changements climatiques, ainsi qu'au développement d'outils de suivi de la biodiversité et des espèces menacées et vulnérables."

